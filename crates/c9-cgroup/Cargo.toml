[package]
name = "c9-cgroup"
description = "cgroups v2 supervisor that contains inference-like workloads"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
c9-policy = { version = "0.1.0", path = "../c9-policy" }
libc = "0.2.191"

[features]
# Tests that create real cgroups. They need root and fail (never skip) without it.
privileged-tests = []

[[test]]
name = "kernel"
required-features = ["privileged-tests"]
